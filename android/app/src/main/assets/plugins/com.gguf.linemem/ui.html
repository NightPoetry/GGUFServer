<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线性记忆</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 面板 WebView 在展开动画中创建时视口高度会固化在小值，故不用 height:100%+flex；
     自然文档流 + min-height:100% + body 滚动最稳（见 v1.0.2 血泪教训）。 */
  html { background: var(--gg-bg, #FAF9F5); }
  body {
    min-height: 100%;
    background: var(--gg-bg, #FAF9F5);
    color: var(--gg-fg, #2D2A26);
    font: 14px/1.65 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    padding: 10px 12px 20px;
  }
  h2 { font-size: 12px; font-weight: 600; color: var(--gg-muted, #6B6557); margin: 16px 2px 7px; letter-spacing: .04em; }
  h2:first-of-type { margin-top: 6px; }
  .card { background: var(--gg-card, #fff); border: 1px solid var(--gg-line, #E7E3D8); border-radius: 10px; padding: 12px 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--gg-muted, #6B6557); }
  .meta b { color: var(--gg-fg, #2D2A26); font-weight: 600; }

  .gauge { margin-top: 10px; }
  .gauge .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--gg-muted, #6B6557); margin-bottom: 4px; }
  .track { height: 7px; border-radius: 999px; background: var(--gg-line, #E7E3D8); overflow: hidden; position: relative; }
  .fill { height: 100%; background: var(--gg-accent, #C96442); border-radius: 999px; transition: width .3s; }
  .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--gg-fg, #2D2A26); opacity: .35; }

  .lt { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: .6px solid var(--gg-line, #E7E3D8); }
  .lt:last-child { border-bottom: none; }
  .lt .idx { color: var(--gg-accent, #C96442); font-size: 11.5px; font-weight: 600; min-width: 16px; padding-top: 1px; }
  .lt .txt { flex: 1; font-size: 13.5px; overflow-wrap: break-word; white-space: pre-wrap; }
  .lt .del { color: var(--gg-muted, #6B6557); border: 1px solid var(--gg-line, #E7E3D8); border-radius: 999px;
             width: 20px; height: 20px; line-height: 18px; text-align: center; font-size: 13px; cursor: pointer; flex: none; }
  .lt .del:active { background: var(--gg-line, #E7E3D8); }

  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; font: inherit; font-size: 13px; color: var(--gg-fg, #2D2A26); background: var(--gg-bg, #FAF9F5);
                  border: 1px solid var(--gg-line, #E7E3D8); border-radius: 8px; padding: 7px 10px; }
  .btn { font: inherit; font-size: 13px; border: 1px solid var(--gg-line, #E7E3D8); background: var(--gg-card, #fff);
         color: var(--gg-fg, #2D2A26); border-radius: 8px; padding: 7px 14px; cursor: pointer; flex: none; }
  .btn:active { background: var(--gg-line, #E7E3D8); }
  .btn.accent { background: var(--gg-accent, #C96442); color: #fff; border-color: transparent; }
  .btn.danger { color: #B4432B; }

  textarea { width: 100%; min-height: 92px; resize: vertical; font: inherit; font-size: 13.5px; line-height: 1.7;
             color: var(--gg-fg, #2D2A26); background: var(--gg-card, #fff); border: none; outline: none; }
  .sumbar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .sumbar .hint { font-size: 11px; color: var(--gg-muted, #6B6557); }

  .log { font-size: 12px; color: var(--gg-muted, #6B6557); }
  .log .li { padding: 5px 0; border-bottom: .6px solid var(--gg-line, #E7E3D8); display: flex; gap: 10px; }
  .log .li:last-child { border-bottom: none; }
  .log .when { flex: none; color: var(--gg-fg, #2D2A26); opacity: .55; }
  .kind-compact { color: var(--gg-accent, #C96442); }

  .empty { font-size: 13px; color: var(--gg-muted, #6B6557); padding: 4px 0; line-height: 1.7; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .foot { padding: 12px 2px 0; font-size: 10.5px; color: var(--gg-muted, #6B6557); line-height: 1.6; }
</style>
</head>
<body>
  <div class="card meta" id="meta">
    <span class="empty">启用后开始工作。模型每次闲置时，会把更早的对话归纳成前情摘要、从新鲜对话里抽取值得长期记住的事实——都在这里展示与管理。</span>
  </div>

  <h2>上下文</h2>
  <div class="card">
    <div class="gauge">
      <div class="row"><span id="gaugeLabel">—</span><span id="gaugePct"></span></div>
      <div class="track"><div class="fill" id="gaugeFill" style="width:0%"></div><div class="mark" id="gaugeMark" style="left:60%"></div></div>
    </div>
  </div>

  <h2>长期记忆</h2>
  <div class="card">
    <div id="ltList"><div class="empty">还没有长期记忆。</div></div>
    <div class="addrow">
      <input id="ltInput" type="text" placeholder="手动添加一条长期事实…" maxlength="200">
      <button class="btn" id="ltAdd">添加</button>
    </div>
  </div>

  <h2>前情摘要</h2>
  <div class="card">
    <textarea id="summary" placeholder="更早对话的滚动归纳会出现在这里，可直接编辑。"></textarea>
    <div class="sumbar">
      <span class="hint" id="sumHint">编辑后点保存</span>
      <button class="btn" id="sumSave">保存</button>
    </div>
  </div>

  <h2>最近活动</h2>
  <div class="card log" id="log"><div class="empty">暂无活动记录。</div></div>

  <div class="actions">
    <button class="btn accent" id="forceBtn">立即整理</button>
    <button class="btn danger" id="resetBtn">清空本会话记忆</button>
  </div>
  <div class="foot">摘要与长期抽取只在模型闲置、对话静默数秒后进行，不占用回复；请求路径只读缓存拼上下文。<br>
    与「记忆（BM25 检索）」插件是两种思路，按需二选一即可。<br>
    建议在「设置」里开启「关闭思考模式」：思考型小模型否则会把 token 都用在思考上，摘要/抽取会拿到空结果。</div>

<script>
(function () {
  'use strict';
  var sid = null;
  var editingSummary = false;

  function isCjk(code) { return code >= 0x4E00 && code <= 0x9FFF; }
  function estimateTokens(t) {
    t = String(t || ''); var cjk = 0, other = 0;
    for (var i = 0; i < t.length; i++) { if (isCjk(t.charCodeAt(i))) cjk++; else other++; }
    return cjk + Math.floor(other / 3.5) + 1;
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function p2(n) { var s = String(n); return s.length < 2 ? '0' + s : s; }
  function fmtTime(ts) { var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  var CTX = (gguf.host && gguf.host.contextSize) || 4096;
  var THRESHOLD = Math.round(CTX * 0.60);

  function ltBlockTokens(lt, summary) {
    // 与 service 的 head 估算同口径（粗略即可，仅供展示）
    var t = 0;
    if (lt && lt.length) t += estimateTokens(lt.join('\n')) + 30;
    if (summary) t += estimateTokens(summary) + 30;
    return t;
  }

  function renderMeta(state, convLen) {
    var meta = document.getElementById('meta');
    meta.innerHTML =
      '<span>已归纳 <b>' + (state.cursor | 0) + '</b> 条</span>' +
      '<span>长期记忆 <b>' + ((state.longterm || []).length) + '</b> 条</span>' +
      (convLen != null ? '<span>会话共 <b>' + convLen + '</b> 条</span>' : '') +
      '<span>更新 <b>' + (state.updatedAt ? fmtTime(state.updatedAt) : '—') + '</b></span>';
  }

  function renderGauge(state, conv) {
    var label = document.getElementById('gaugeLabel');
    var pctEl = document.getElementById('gaugePct');
    var fill = document.getElementById('gaugeFill');
    if (!conv) { label.textContent = '未归纳内容占用（估算）'; pctEl.textContent = ''; fill.style.width = '0%'; return; }
    var live = ltBlockTokens(state.longterm, state.summary);
    for (var i = (state.cursor | 0); i < conv.length; i++) live += estimateTokens(conv[i].content) + 6;
    var pct = Math.min(100, Math.round(live / CTX * 100));
    label.textContent = '注入 + 未归纳 ≈ ' + live + ' tok';
    pctEl.textContent = pct + '% / 阈值 60%';
    fill.style.width = pct + '%';
    fill.style.background = live > THRESHOLD ? 'var(--gg-accent,#C96442)' : 'var(--gg-accent,#C96442)';
  }

  function renderLt(state) {
    var box = document.getElementById('ltList');
    var lt = state.longterm || [];
    if (!lt.length) { box.innerHTML = '<div class="empty">还没有长期记忆。模型闲置时会自动抽取，你也可以手动添加。</div>'; return; }
    var html = '';
    lt.forEach(function (s, i) {
      html += '<div class="lt"><span class="idx">' + (i + 1) + '</span><span class="txt">' + esc(s) +
        '</span><span class="del" data-i="' + i + '">✕</span></div>';
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.del'), function (el) {
      el.addEventListener('click', function () {
        gguf.events.broadcast('lt-delete', { index: parseInt(el.getAttribute('data-i'), 10) });
      });
    });
  }

  function renderSummary(state) {
    if (editingSummary) return;   // 编辑中不覆盖用户输入
    document.getElementById('summary').value = state.summary || '';
  }

  function renderLog(state) {
    var box = document.getElementById('log');
    var log = (state.log || []).slice().reverse();
    if (!log.length) { box.innerHTML = '<div class="empty">暂无活动记录。</div>'; return; }
    box.innerHTML = log.map(function (e) {
      return '<div class="li"><span class="when">' + esc(fmtTime(e.ts)) + '</span><span class="kind-' +
        esc(e.kind) + '">' + esc(e.detail) + '</span></div>';
    }).join('');
  }

  function refresh() {
    gguf.chat.current().then(function (cur) {
      if (!cur || cur.id == null) return;
      sid = String(cur.id);
      var state, conv = null;
      return gguf.storage.get('mem:' + sid).then(function (v) {
        state = normalize(v);
        return gguf.chat.messages().catch(function () { return null; });
      }).then(function (raw) {
        if (raw) { conv = []; for (var i = 0; i < raw.length; i++) { var m = raw[i]; if (m && (m.role === 'user' || m.role === 'assistant') && String(m.content || '').trim()) conv.push(m); } }
        renderMeta(state, conv ? conv.length : null);
        renderGauge(state, conv);
        renderLt(state);
        renderSummary(state);
        renderLog(state);
      });
    }).catch(function () {});
  }

  function normalize(v) {
    if (!v || typeof v !== 'object') return { summary: '', longterm: [], cursor: 0, ltCursor: 0, updatedAt: 0, log: [] };
    return {
      summary: String(v.summary || ''),
      longterm: Array.isArray(v.longterm) ? v.longterm : [],
      cursor: v.cursor | 0, ltCursor: v.ltCursor | 0, updatedAt: v.updatedAt | 0,
      log: Array.isArray(v.log) ? v.log : [],
    };
  }

  document.getElementById('ltAdd').addEventListener('click', function () {
    var inp = document.getElementById('ltInput');
    var t = inp.value.trim();
    if (!t) return;
    gguf.events.broadcast('lt-add', { text: t });
    inp.value = '';
  });
  document.getElementById('ltInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('ltAdd').click(); }
  });

  var sumEl = document.getElementById('summary');
  sumEl.addEventListener('focus', function () { editingSummary = true; });
  sumEl.addEventListener('blur', function () { editingSummary = false; });
  document.getElementById('sumSave').addEventListener('click', function () {
    gguf.events.broadcast('summary-set', { text: sumEl.value });
    editingSummary = false;
    gguf.ui.toast('已保存前情摘要');
  });

  document.getElementById('forceBtn').addEventListener('click', function () {
    gguf.events.broadcast('force-tick', null);
    gguf.ui.toast('已请求立即整理（模型空闲时执行）');
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    gguf.events.broadcast('reset', null);
  });

  gguf.events.on('show', refresh);
  gguf.events.on('mem-changed', refresh);
  refresh();
})();
</script>
</body>
</html>
