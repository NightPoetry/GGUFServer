<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重型记忆</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--gg-bg, #FAF9F5); }
  body { min-height: 100%; background: var(--gg-bg, #FAF9F5); color: var(--gg-fg, #2D2A26);
    font: 14px/1.65 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; padding: 10px 12px 20px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--gg-muted, #6B6557); margin: 16px 2px 7px; letter-spacing: .04em; }
  h2:first-of-type { margin-top: 6px; }
  .card { background: var(--gg-card, #fff); border: 1px solid var(--gg-line, #E7E3D8); border-radius: 10px; padding: 12px 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--gg-muted, #6B6557); }
  .meta b { color: var(--gg-fg, #2D2A26); font-weight: 600; }
  .bad { color: #B4432B; }
  .ok { color: var(--gg-accent, #C96442); }
  .cover { height: 8px; border-radius: 999px; background: var(--gg-line,#E7E3D8); overflow: hidden; margin-top: 10px; display: flex; }
  .cover .done { height: 100%; background: var(--gg-accent,#C96442); }
  .cover .frag { height: 100%; background: repeating-linear-gradient(45deg, #D9A08a, #D9A08a 3px, transparent 3px, transparent 6px); }
  .it { padding: 8px 0; border-bottom: .6px solid var(--gg-line, #E7E3D8); }
  .it:last-child { border-bottom: none; }
  .it .top { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .tag { font-size: 10.5px; border-radius: 999px; padding: 0 7px; line-height: 16px; border: 1px solid var(--gg-line,#E7E3D8); color: var(--gg-muted,#6B6557); }
  .tag.pri { color: var(--gg-accent,#C96442); border-color: var(--gg-accent,#C96442); }
  .it .txt { font-size: 13.5px; overflow-wrap: break-word; white-space: pre-wrap; }
  .empty { font-size: 13px; color: var(--gg-muted, #6B6557); padding: 4px 0; line-height: 1.7; }
  .log { font-size: 12px; color: var(--gg-muted, #6B6557); }
  .log .li { padding: 5px 0; border-bottom: .6px solid var(--gg-line, #E7E3D8); display: flex; gap: 10px; }
  .log .li:last-child { border-bottom: none; }
  .log .when { flex: none; color: var(--gg-fg, #2D2A26); opacity: .55; }
  .foot { padding: 12px 2px 0; font-size: 10.5px; color: var(--gg-muted, #6B6557); line-height: 1.6; }
</style>
</head>
<body>
  <div class="card meta" id="status"><span class="empty">在设置里选好「记忆模型」并启用后，闲置时会开始抽取记忆、发散建边、碎片整理。</span></div>

  <h2>染色覆盖（已扫描进记忆的历史 / 碎片=跳过未扫的中段）</h2>
  <div class="card"><div class="cover" id="cover"></div><div class="meta" id="coverMeta" style="margin-top:8px"></div></div>

  <h2>存放区（当前驻留上下文的记忆 · 两态：在/移除）</h2>
  <div class="card" id="resident"><div class="empty">空。</div></div>

  <h2>最近活动</h2>
  <div class="card log" id="log"><div class="empty">暂无。</div></div>
  <div class="foot">存放区两态铁律：条目只有「在/移除」，原位不动、不随热度重排 → 上下文字节稳定、命中 KV 缓存。<br>
    一次指针=顺序扫达（深绿，底下无碎片）；二次指针=跳达的锚（浅），做梦扫碎片后升为一次。</div>

<script>
(function () {
  'use strict';
  var sid = null;
  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function p2(n){var s=String(n);return s.length<2?'0'+s:s;}
  function fmt(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p2(d.getHours())+':'+p2(d.getMinutes());}

  function render(st, ready, model) {
    var items = st.items || [], edges = st.edges || {}, resident = st.resident || [];
    var edgeCount = 0; for (var k in edges) if (edges.hasOwnProperty(k)) edgeCount += (edges[k]||[]).length;
    document.getElementById('status').innerHTML =
      '<span>记忆模型 <b class="' + (ready?'ok':'bad') + '">' + (model?esc(model):'未配置') + (ready?' · 就绪':(model?' · 未就绪':'')) + '</b></span>' +
      '<span>条目 <b>' + items.length + '</b></span>' +
      '<span>关联边 <b>' + edgeCount + '</b></span>' +
      '<span>存放区 <b>' + resident.length + '</b></span>' +
      '<span>更新 <b>' + (st.updatedAt?fmt(st.updatedAt):'—') + '</b></span>';

    // 染色覆盖条：已扫 scannedThrough / 总消息 total；碎片区用斜纹
    var total = Math.max(st.total || 0, st.scannedThrough || 0, 1);
    var done = Math.min(st.scannedThrough || 0, total);
    var fragTok = (st.fragments || []).reduce(function (a, f) { return a + Math.max(0, f[1] - f[0]); }, 0);
    var cover = document.getElementById('cover');
    var donePct = done / total * 100, fragPct = Math.min(fragTok, total) / total * 100;
    cover.innerHTML = '<div class="done" style="width:' + donePct + '%"></div><div class="frag" style="width:' + fragPct + '%"></div>';
    document.getElementById('coverMeta').innerHTML =
      '<span>已扫 <b>' + done + '</b> / ' + total + ' 条消息</span>' +
      '<span>碎片欠债 <b class="' + (fragTok?'bad':'') + '">' + (st.fragments||[]).length + '</b> 段</span>';

    var box = document.getElementById('resident');
    if (!resident.length) { box.innerHTML = '<div class="empty">空——还没有记忆被调入存放区。</div>'; }
    else {
      var byId = {}; items.forEach(function (it) { byId[it.id] = it; });
      box.innerHTML = resident.map(function (id) {
        var it = byId[id]; if (!it) return '';
        return '<div class="it"><div class="top"><span class="tag ' + (it.primary?'pri':'') + '">' + (it.primary?'一次':'二次') +
          '</span><span class="tag">热度 ' + (it.heat||0) + '</span></div><div class="txt">' + esc(it.text) + '</div></div>';
      }).join('') || '<div class="empty">空。</div>';
    }

    var log = (st.log || []).slice().reverse();
    document.getElementById('log').innerHTML = log.length
      ? log.map(function (e) { return '<div class="li"><span class="when">' + esc(fmt(e.ts)) + '</span><span>' + esc(e.detail) + '</span></div>'; }).join('')
      : '<div class="empty">暂无。</div>';
  }

  function refresh() {
    gguf.chat.current().then(function (cur) {
      if (!cur || cur.id == null) return;
      sid = String(cur.id);
      return Promise.all([gguf.storage.get('hm:' + sid), gguf.memllm.status()]).then(function (r) {
        var st = (r[0] && typeof r[0] === 'object') ? r[0] : { items: [], edges: {}, resident: [], scannedThrough: 0, fragments: [] };
        var ms = r[1] || {};
        render(st, !!ms.ready, ms.model);
      });
    }).catch(function () {});
  }
  gguf.events.on('show', refresh);
  gguf.events.on('mem-changed', refresh);
  refresh();
})();
</script>
</body>
</html>
