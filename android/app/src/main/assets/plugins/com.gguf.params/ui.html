<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参数导演</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--gg-bg, #FAF9F5); }
  body {
    min-height: 100%;
    background: var(--gg-bg, #FAF9F5);
    color: var(--gg-fg, #2D2A26);
    font: 13.5px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    padding: 12px 14px 16px;
  }
  h3 { font-size: 11.5px; font-weight: 600; color: var(--gg-muted, #6B6557); letter-spacing: .04em; margin: 14px 2px 8px; }
  h3:first-child { margin-top: 2px; }
  .card { border: 1px solid var(--gg-line, #E7E3D8); border-radius: 10px; background: var(--gg-card, #fff); overflow: hidden; }
  .tier { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: .6px solid var(--gg-line, #E7E3D8); }
  .tier:last-child { border-bottom: none; }
  .tier .n { font-weight: 600; }
  .tier .p { color: var(--gg-muted, #6B6557); font-variant-numeric: tabular-nums; font-size: 12px; }
  .h { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; border-bottom: .6px solid var(--gg-line, #E7E3D8); }
  .h:last-child { border-bottom: none; }
  .h .tier-tag { font-weight: 600; color: var(--gg-accent, #C96442); }
  .h .via { color: var(--gg-muted, #6B6557); font-size: 12px; }
  .h .t { color: var(--gg-muted, #6B6557); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { font-size: 12px; color: var(--gg-muted, #6B6557); padding: 10px 12px; }
  .hint { font-size: 11px; color: var(--gg-muted, #6B6557); line-height: 1.5; margin-top: 8px; }
</style>
</head>
<body>
  <h3>当前参数档</h3>
  <div class="card" id="tiers"><div class="empty">读取中…</div></div>

  <h3>最近判定</h3>
  <div class="card" id="history"><div class="empty">还没有记录。发一条消息试试。</div></div>

  <div class="hint">写代码/算题走精确档（0 温度），写作走创作档（高温），其余聊天档；三档都带 DRY 防复读。
  详细配置在 设置 → 插件 → 参数导演 的设置卡片里。</div>

<script>
(function () {
  'use strict';
  var TIER_NAME = { precise: '精确', creative: '创作', chat: '聊天' };

  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

  function fmtParams(cfg, tier) {
    if (tier === 'precise') return 'temp 0 · DRY ' + cfg.dry;
    if (tier === 'creative') return 'temp ' + cfg.creativeTemp + ' · top_p 0.95 · DRY ' + cfg.dry;
    return 'temp ' + cfg.chatTemp + ' · top_p 0.95 · DRY ' + cfg.dry;
  }

  function loadTiers() {
    gguf.storage.get('config').then(function (c) {
      var cfg = {
        chatTemp: (c && typeof c.chatTemp === 'number') ? c.chatTemp : 0.7,
        creativeTemp: (c && typeof c.creativeTemp === 'number') ? c.creativeTemp : 0.9,
        dry: (c && typeof c.dry === 'number') ? c.dry : 0.8,
      };
      document.getElementById('tiers').innerHTML = ['precise', 'creative', 'chat'].map(function (t) {
        return '<div class="tier"><span class="n">' + TIER_NAME[t] + '档</span><span class="p">' + esc(fmtParams(cfg, t)) + '</span></div>';
      }).join('');
    }).catch(function () {});
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function loadHistory() {
    gguf.storage.get('history').then(function (h) {
      if (!Array.isArray(h) || !h.length) return;
      document.getElementById('history').innerHTML = h.map(function (e) {
        return '<div class="h"><span class="tier-tag">' + esc(TIER_NAME[e.tier] || e.tier) + '档</span>' +
          '<span class="via">' + esc(e.via || '') + (e.ms > 50 ? ' · ' + e.ms + 'ms' : '') + '</span>' +
          '<span class="t">' + fmtTime(e.ts) + '</span></div>';
      }).join('');
    }).catch(function () {});
  }

  function refresh() { loadTiers(); loadHistory(); }
  gguf.events.on('show', refresh);
  gguf.events.on('decision', loadHistory); // service 每次判定后广播
  refresh();
})();
</script>
</body>
</html>
