<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外援</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--gg-bg, #FAF9F5); }
  body {
    min-height: 100%; background: var(--gg-bg, #FAF9F5); color: var(--gg-fg, #2D2A26);
    font: 13.5px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    padding: 12px 14px 18px;
  }
  h3 { font-size: 11.5px; font-weight: 600; color: var(--gg-muted, #6B6557); letter-spacing: .04em; margin: 14px 2px 8px; }
  h3:first-child { margin-top: 2px; }
  .card { border: 1px solid var(--gg-line, #E7E3D8); border-radius: 10px; background: var(--gg-card, #fff); overflow: hidden; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: .6px solid var(--gg-line, #E7E3D8); }
  .line:last-child { border-bottom: none; }
  .k { color: var(--gg-muted, #6B6557); }
  .v { font-weight: 600; text-align: right; word-break: break-all; }
  .v.off { color: var(--gg-muted, #6B6557); font-weight: 400; }
  .v.on { color: var(--gg-accent, #C96442); }
  .hint { font-size: 11px; color: var(--gg-muted, #6B6557); line-height: 1.55; margin-top: 9px; }
  button {
    width: 100%; margin-top: 10px; padding: 9px 12px; font: inherit; font-weight: 600;
    color: #fff; background: var(--gg-accent, #C96442); border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .res { font-size: 12px; margin-top: 8px; line-height: 1.55; word-break: break-all; }
</style>
</head>
<body>
  <h3>当前状态</h3>
  <div class="card">
    <div class="line"><span class="k">外援</span><span class="v off" id="vOn">未启用</span></div>
    <div class="line"><span class="k">端点</span><span class="v" id="vEp">—</span></div>
    <div class="line"><span class="k">模型</span><span class="v" id="vModel">—</span></div>
    <div class="line"><span class="k">范围</span><span class="v" id="vOnly">—</span></div>
    <div class="line"><span class="k">记录</span><span class="v" id="vStat">—</span></div>
  </div>
  <button id="btn">测一次连通性</button>
  <div class="res" id="res"></div>
  <div class="hint">
    外援只接管<b>插件发起的</b>推理（乐句编曲、便签抽取、参数判断…），你与模型的正常对话仍然走本机。
    任何失败都会退回本机模型再算一次。配置在「插件管理 → 外援」的设置卡片里。
  </div>

<script src="/gguf-sdk.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = {
    'com.gguf.midi': '乐句', 'com.gguf.notes': '便签', 'com.gguf.params': '参数导演',
    'com.gguf.heavymem': '重型记忆', 'com.gguf.linemem': '线性记忆',
  };
  var cfg = null;

  gguf.storage.get('cfg').then(function (c) {
    cfg = c || {};
    $('vOn').textContent = cfg.enabled ? '已启用' : '未启用';
    $('vOn').className = 'v ' + (cfg.enabled ? 'on' : 'off');
    $('vEp').textContent = cfg.endpoint || '未填';
    $('vModel').textContent = cfg.model || '未填';
    var only = Array.isArray(cfg.only) ? cfg.only : [];
    $('vOnly').textContent = only.length
      ? only.map(function (i) { return NAMES[i] || i; }).join('、')
      : '全部插件';
  });
  gguf.storage.get('stat').then(function (s) {
    $('vStat').textContent = s
      ? ('接 ' + (s.ok || 0) + ' · 回落 ' + (s.fail || 0) + ' · 没接 ' + (s.skip || 0))
      : '还没有调用';
  });

  $('btn').onclick = function () {
    if (!cfg || !cfg.endpoint || !cfg.model) { $('res').textContent = '先在设置卡片里填端点和模型名。'; return; }
    this.disabled = true;
    $('res').textContent = '正在请求…';
    var t0 = Date.now();
    gguf.net.fetchJson({
      url: cfg.endpoint,
      headers: { Authorization: 'Bearer ' + (cfg.apiKey || '') },
      json: { model: cfg.model, messages: [{ role: 'user', content: '回答两个字：收到' }], max_tokens: 16, stream: false },
      timeoutMs: 30000,
    }).then(function (r) {
      var dt = ((Date.now() - t0) / 1000).toFixed(1);
      if (r.status < 200 || r.status >= 300) {
        $('res').textContent = '✗ HTTP ' + r.status + '（' + dt + 's）：' + String(r.body || '').slice(0, 160);
        return;
      }
      var j = JSON.parse(r.body);
      var c = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      $('res').textContent = '✓ 通了（' + dt + 's）：' + String(c).slice(0, 80);
    }).catch(function (e) {
      $('res').textContent = '✗ ' + ((e && e.message) || e);
    }).then(function () { $('btn').disabled = false; });
  };
})();
</script>
</body>
</html>
